<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preload" as="image" href="/splash-portrait.webp" media="(orientation: portrait)" />
    <link rel="preload" as="image" href="/splash-landscape.webp" media="(orientation: landscape)" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Manu Team</title>
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="description" content="Gestão de treinos — Consultoria & Presencial" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Manu Team" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- fonte sem travar a abertura: com internet fraca o app abre na fonte do sistema e troca quando a Inter chegar -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>
  </head>
  <body>
    <!-- abertura em tela cheia: a cena do gorila (versão em pé para celular, deitada para tablet/PC); toque para pular -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;background:#000;transition:opacity .45s ease">
      <picture>
        <source media="(orientation: portrait)" srcset="/splash-portrait.webp" />
        <img src="/splash-landscape.webp" alt="" fetchpriority="high" decoding="async" style="width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block" />
      </picture>
    </div>
    <script>
      // gorila só ao abrir o app: ao atualizar a página (ou o app se atualizar sozinho) a abertura não aparece de novo
      try { if (sessionStorage.getItem('mgt_splash')) document.getElementById('splash').remove(); else sessionStorage.setItem('mgt_splash', '1') } catch (e) { /* sem armazenamento: mostra normalmente */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
